name: Release

# 打 v* 标签即发版：macOS（x64 + arm64）与 Windows（x64）分别构建，
# 最后统一上传到同一个 GitHub Release（含 latest-mac.yml / latest.yml）。
# 也可以在 Actions 里手动触发，版本号由输入决定。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不带 v，例如 0.1.1）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# GitHub 的 electron / electron-builder 二进制下载偶尔 504，CI 统一走镜像。
env:
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Resolve version
        id: meta
        shell: bash
        env:
          RAW_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          VERSION="${RAW_VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "版本号不合法：$VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  mac:
    needs: prepare
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      # secrets 不能直接出现在 if 里：先落成 job-level env，再按 env 判断。
      HAS_CSC: ${{ secrets.CSC_LINK != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tag / 手动输入是版本的唯一来源，免得打完包才发现 package.json 还是旧版本。
      - name: Sync version
        shell: bash
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Typecheck
        run: pnpm typecheck

      # 一次打包两个架构：CI 机器架构不一定和用户一致，agent-browser 两个
      # 原生二进制都带上，运行时按 process.arch 自己挑。
      - name: Stage agent-browser binaries
        run: node scripts/stage-agent-browser.mjs --arch x64,arm64

      - name: Build renderer / main / preload
        run: pnpm build

      # 只有配置了 CSC_LINK 才把证书与公证凭据写进后续步骤的环境变量。
      # 空字符串不能直接传给 electron-builder，否则它会把工作目录当成证书路径。
      - name: Configure macOS signing
        if: env.HAS_CSC == 'true'
        shell: bash
        env:
          CSC_LINK_VALUE: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_VALUE: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID_VALUE: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_VALUE: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_VALUE: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          {
            echo "CSC_LINK=$CSC_LINK_VALUE"
            echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD_VALUE"
            if [ -n "$APPLE_ID_VALUE" ]; then
              echo "APPLE_ID=$APPLE_ID_VALUE"
              echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD_VALUE"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_VALUE"
            fi
          } >> "$GITHUB_ENV"

      - name: Package
        run: pnpm exec electron-builder --mac --x64 --arm64 --publish never
        env:
          # 没有证书时明确跳过签名（macOS 自动更新要求签名，见 README）。
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.HAS_CSC == 'true' && 'true' || 'false' }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-artifacts
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error

  win:
    needs: prepare
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version
        shell: bash
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Typecheck
        run: pnpm typecheck

      - name: Stage agent-browser binary
        run: node scripts/stage-agent-browser.mjs --arch x64

      - name: Build renderer / main / preload
        run: pnpm build

      - name: Package
        run: pnpm exec electron-builder --win --x64 --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-artifacts
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

  publish:
    needs: [prepare, mac, win]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: GoodJob ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: artifacts/**/*
