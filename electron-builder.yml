appId: com.goodjob.desktop
productName: GoodJob
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
asarUnpack:
  - resources/**
  # AOQ 语音 SDK 带原生 .node / .framework，必须解包到 app.asar.unpacked 才能加载。
  - node_modules/aoq-electron-sdk/**
mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  # 本机没有证书时 electron-builder 自动跳过签名；GitHub Actions 用
  # CSC_LINK / CSC_KEY_PASSWORD 注入 Developer ID。macOS 自动更新要求签名。
  hardenedRuntime: true
  gatekeeperAssess: false
  # 语音面试要采麦克风：用途说明 + audio-input entitlement（默认模板里没有）。
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: GoodJob 使用麦克风把你在模拟面试里的回答转成文字。音频不落盘。
win:
  icon: build/icon.png
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
# 自动更新元数据（latest-mac.yml / latest.yml）由 electron-builder 生成；
# CI 把安装包和元数据一起放进 GitHub Release。
publish:
  provider: github
  owner: ShaneLevs
  repo: GoodJob
  releaseType: release
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
# agent-browser（P4 浏览器自动化）：只带当前平台的原生二进制（≈9–16MB），
# 打包前先跑 node scripts/stage-agent-browser.mjs 生成 resources/agent-browser。
# 运行时 main 进程从 process.resourcesPath/agent-browser 定位（agent/agent-browser.ts）。
extraResources:
  - from: resources/agent-browser
    to: agent-browser
